steps:
  # 1. Build container image using Dockerfile (caches Kokoro model weights)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/family-story-night-voice:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/family-story-night-voice:latest'
      - '.'

  # 2. Push image to Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/family-story-night-voice:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/family-story-night-voice:latest'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'family-story-night-voice'
      - '--image'
      - 'gcr.io/$PROJECT_ID/family-story-night-voice:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--memory'
      - '16Gi'
      - '--cpu'
      - '4'
      - '--gpu'
      - '1'
      - '--gpu-type'
      - 'nvidia-l4'
      - '--no-cpu-throttling'
      - '--concurrency'
      - '4'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/family-story-night-voice:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/family-story-night-voice:latest'

options:
  logging: CLOUD_LOGGING_ONLY
